[project]
name = "guaumiau"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
    "streamlit>=1.67.0",
    "torch",
    "torchaudio",
    "transformers>=5.22.2",
]

# PyTorch con CUDA 12.8 (driver NVIDIA con CUDA 13.5, ver nvidia-smi).
# En Windows/Linux se usa el índice cu128; en macOS no hay CUDA.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
